# 最小可跑配置：Open WebUI + Ollama + pgvector
#
# 使用方法：
#   cp docker-compose.example.yml docker-compose.yml
#   按需修改端口和数据卷路径，然后 docker compose up -d
#
# 注意：这个配置不包含重排服务（TEI + adapter）。
# 没有重排时，hitrate.js 的分数来自向量相似度，量纲不同但脚本仍可用。

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # 有 NVIDIA 显卡时取消下面注释
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: owui
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
      POSTGRES_DB: openwebui
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owui -d openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.0-slim
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql://owui:${PG_PASSWORD:-changeme}@pgvector:5432/openwebui
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://owui:${PG_PASSWORD:-changeme}@pgvector:5432/openwebui
      # 嵌入模型跑在 CPU 上，避免和生成模型抢显存
      # RAG_EMBEDDING_MODEL: bge-m3
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
    volumes:
      - open-webui-data:/app/backend/data
      - ./theme:/app/build/static/theme:ro
    depends_on:
      pgvector:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  ollama-models:
  pgdata:
  open-webui-data:
